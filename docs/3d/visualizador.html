<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: bancada — lista de placas | placa em 3D | ficha técnica da placa. No celular empilha. */
:root {
  --bg: #eef1ec; --panel: #f8faf6; --ink: #17201a; --muted: #56625a; --line: #d2dad1;
  --mask: #1d5c34; --mask-soft: #dceadf; --copper: #a85f22; --stage-a: #e4eae2; --stage-b: #cfd8cd;
  --pin: #ffffff;
  --f-display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d120f; --panel: #141b16; --ink: #e2e9e1; --muted: #95a298; --line: #263129;
  --mask: #6cc58b; --mask-soft: #1c2c21; --copper: #e39a5c; --stage-a: #1b241e; --stage-b: #0f1511; --pin: #1b241e;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d120f; --panel: #141b16; --ink: #e2e9e1; --muted: #95a298; --line: #263129;
  --mask: #6cc58b; --mask-soft: #1c2c21; --copper: #e39a5c; --stage-a: #1b241e; --stage-b: #0f1511; --pin: #1b241e;
  color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr);
  height: 100%; min-height: 560px; }
header.topo { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
header.topo h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; margin: 0; }
header.topo .autor { color: var(--muted); font-size: 13px; }
header.topo .ver { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
nav.lista { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px; background: var(--panel); }
nav.lista button { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: baseline; gap: 6px; width: 100%;
  text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 8px; border-radius: 6px;
  font: inherit; font-size: 14px; cursor: pointer; }
nav.lista button .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.lista button:hover { background: var(--mask-soft); }
nav.lista button[aria-current="true"] { background: var(--mask); color: var(--panel); }
nav.lista button[aria-current="true"] .n { color: inherit; opacity: .8; }
nav.lista button:focus-visible, .ctl button:focus-visible, .ctl label:focus-within { outline: 2px solid var(--copper); outline-offset: 2px; }
.palco { position: relative; min-width: 0; background: radial-gradient(120% 90% at 50% 35%, var(--stage-a), var(--stage-b)); }
.palco canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ctl { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.ctl > * { pointer-events: auto; }
.ctl .grp { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ctl button, .ctl label { font: 500 13px var(--f-body); color: var(--ink); background: transparent; border: 0; padding: 7px 12px; cursor: pointer;
  display: flex; align-items: center; gap: 6px; }
.ctl .grp > * + * { border-left: 1px solid var(--line); }
.ctl button[aria-pressed="true"] { background: var(--mask); color: var(--panel); }
.ctl input { accent-color: var(--mask); margin: 0; }
.medida { position: absolute; top: 12px; left: 12px; font: 500 12px var(--f-mono); color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-variant-numeric: tabular-nums; }
.estado { position: absolute; inset: 0; display: grid; place-items: center; font: 500 14px var(--f-mono); color: var(--muted); pointer-events: none; }
aside.ficha { border-left: 1px solid var(--line); overflow-y: auto; background: var(--panel);
  padding-block: 18px 28px; padding-inline: 20px; }
.ficha h2 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0 0 6px; text-wrap: balance; }
.ficha .resumo { color: var(--muted); margin: 0 0 12px; }
.ficha .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
.ficha .chips li { font: 500 12px var(--f-mono); padding: 3px 8px; border-radius: 4px; background: var(--mask-soft); color: var(--ink); font-variant-numeric: tabular-nums; }
.ficha h3 { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--copper); margin: 22px 0 8px; }
.ficha p { margin: 0 0 10px; }
.ficha ol, .ficha ul { margin: 0; padding-left: 18px; }
.ficha li { margin: 0 0 8px; }
.tab { width: 100%; border-collapse: collapse; font-size: 14px; }
.tab td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tab td:first-child { font: 500 13px var(--f-mono); padding-right: 12px; white-space: nowrap; color: var(--mask); }
.con { border-top: 1px solid var(--line); padding: 8px 0; }
.con .cab { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.con .ref { font: 600 13px var(--f-mono); color: var(--mask); }
.con .nm { font: 500 13px var(--f-body); }
.con .liga { font-size: 12px; color: var(--muted); width: 100%; }
.pinos { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.pinos span { font: 500 11.5px var(--f-mono); border: 1px solid var(--line); background: var(--pin); border-radius: 3px; padding: 1px 6px; }
.pinos span:first-child { border-color: var(--copper); }
.pinos span b { font-weight: 400; color: var(--muted); margin-right: 3px; }
details summary { cursor: pointer; color: var(--mask); font-weight: 500; }
a { color: var(--mask); }
.mais { display: inline-block; margin-top: 18px; font-weight: 600; }
code { font-family: var(--f-mono); font-size: .92em; }
@media (max-width: 1100px) { .app { grid-template-columns: 220px minmax(0, 1fr); }
  aside.ficha { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } .app { height: auto; } .palco { height: 70vh; } }
@media (max-width: 720px) {
  .app { display: block; }
  nav.lista { display: flex; overflow-x: auto; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); padding-inline: 12px; }
  nav.lista button { width: auto; flex: 0 0 auto; white-space: nowrap; display: flex; }
  .palco { height: 62vh; min-height: 340px; }
  aside.ficha { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header.topo .ver { margin-left: 0; }
}
.render header.topo, .render nav.lista, .render aside.ficha, .render .ctl, .render .medida, .render .estado { display: none !important; }
.render .app { display: block; height: 100%; } .render .palco { height: 100%; background: transparent; } .render body, body.render { background: transparent; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <h1>Computador 8 Bits — placas em 3D</h1>
    <span class="autor">projeto de Marcos Silva dos Santos (MarcosObel)</span>
    <span class="ver">v3.0 · 13 placas · KiCad</span>
  </header>
  <nav class="lista" id="lista" aria-label="Placas"></nav>
  <main class="palco" id="palco">
    <canvas id="cena" aria-label="Modelo 3D da placa — arraste para girar, role para aproximar"></canvas>
    <div class="medida" id="medida"></div>
    <div class="estado" id="estado">carregando…</div>
    <div class="ctl">
      <div class="grp" role="group" aria-label="Vista">
        <button type="button" id="v-3d" aria-pressed="true">3D</button>
        <button type="button" id="v-topo" aria-pressed="false">Topo</button>
        <button type="button" id="v-fundo" aria-pressed="false">Fundo</button>
      </div>
      <div class="grp">
        <label for="c-comp"><input type="checkbox" id="c-comp" checked> Componentes</label>
        <label for="c-gira"><input type="checkbox" id="c-gira"> Girar</label>
      </div>
    </div>
  </main>
  <aside class="ficha" id="ficha" aria-live="polite"></aside>
</div>
<script>window.PLACAS = [{"id": "backplane-barramento", "ordem": 1, "nome": "Backplane / Barramento", "resumo": "Placa-mãe: entrada de 5 V protegida, barramento D0…D7 com LEDs e todos os sinais entre os módulos.", "funcao": "É a \"placa-mãe\" do computador. Não tem lógica: recebe a fonte de 5 V, protege e distribui a alimentação para os 12 módulos e liga entre si todos os sinais que precisam passar de uma placa para outra — o <strong>barramento de dados D0…D7<\/strong> e os <strong>18 sinais de controle<\/strong> que saem do Decodificador de Controle. Cada módulo se liga a ela com cabos de 4 vias retos.", "funcionamento": ["<strong>Entrada de energia.<\/strong> A fonte entra pelo jack J1 (5,5 × 2,1 mm, centro positivo) ou pelo borne J2. Passa pela chave LIGA/DESLIGA (SW1) e pelo fusível rearmável F1 (PTC 3 A).", "<strong>Proteção contra inversão.<\/strong> O diodo D1 (1N5822) fica *ao contrário* entre +5 V e GND. Com a polaridade certa ele não conduz. Se a fonte for ligada invertida, D1 conduz forte, a corrente sobe e o PTC abre — os CIs ficam protegidos. Depois de corrigir, o PTC volta sozinho em alguns segundos.", "<strong>Reserva de energia.<\/strong> C1 (470 µF) segura a tensão durante os picos de consumo (LEDs e saídas TTL chaveando juntos); C2 (100 nF) filtra ruído rápido. O LED1 verde indica 5 V presente.", "<strong>Barramento.<\/strong> As linhas D0…D7 passam por todos os conectores BL_* (D0…D3) e BH_* (D4…D7). Os 8 LEDs vermelhos (LED2…LED9) mostram o valor do barramento em tempo real — é a melhor ferramenta de depuração do computador: em cada passo do clock você vê quem está escrevendo no barramento.", "<strong>Sinais de controle.<\/strong> Os conectores CD_A…CD_E recebem os 18 sinais do microcódigo e os levam aos conectores C_* de cada módulo, sempre na mesma ordem de pinos impressa na serigrafia."], "blocos": [["J1, J2", "entrada de 5 V (jack ou borne)"], ["SW1", "liga/desliga"], ["F1", "fusível rearmável PTC 3 A"], ["D1", "proteção contra inversão de polaridade"], ["C1, C2", "reserva e filtro da alimentação"], ["J3…J14 (P_*)", "alimentação para cada módulo (+5V +5V GND GND)"], ["J15…J28 (BL_*, BH_*)", "barramento de dados para os 7 módulos que leem/escrevem nele"], ["J29…J46 (C_*, CD_*)", "sinais de controle"], ["J47 (EXPANSAO)", "saídas livres para futuras placas"]], "leds": [["LED1 (verde)", "5 V presente"], ["LED2…LED9 (vermelhos)", "valor do barramento D7…D0 (aceso = 1)"]], "controles": [["SW1", "liga/desliga o computador inteiro"]], "conectores": [{"ref": "J1", "nome": "Jack DC 5,5x2,1 (5 V)", "pinos": ["VIN", "GND", "GND"], "liga": ""}, {"ref": "J2", "nome": "Borne 5 V", "pinos": ["+5V", "GND"], "liga": ""}, {"ref": "J3", "nome": "P_ACC", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Registrador A (Acumulador) J1"}, {"ref": "J4", "nome": "P_B", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Registrador B J1"}, {"ref": "J5", "nome": "P_ALU", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "ULA (Unidade Lógica e Aritmética) J1"}, {"ref": "J6", "nome": "P_IR", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Registrador de Instrução (IR) J1"}, {"ref": "J7", "nome": "P_OUT", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Registrador de Saída J1"}, {"ref": "J8", "nome": "P_PC", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Contador de Programa (PC) J1"}, {"ref": "J9", "nome": "P_RAM", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "RAM e MAR J1"}, {"ref": "J10", "nome": "P_CD", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Decodificador de Controle J1"}, {"ref": "J11", "nome": "P_FETCH", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Contador de Passos J1"}, {"ref": "J12", "nome": "P_CLOCK", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Clock J1"}, {"ref": "J13", "nome": "P_RESET", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Reset J1"}, {"ref": "J14", "nome": "P_DISPLAY", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "Display Decimal J1"}, {"ref": "J15", "nome": "BL_ACC", "pinos": ["D0", "D1", "D2", "D3"], "liga": "Registrador A (Acumulador) J3"}, {"ref": "J16", "nome": "BL_B", "pinos": ["D0", "D1", "D2", "D3"], "liga": "Registrador B J3"}, {"ref": "J17", "nome": "BL_ALU", "pinos": ["D0", "D1", "D2", "D3"], "liga": "ULA (Unidade Lógica e Aritmética) J2"}, {"ref": "J18", "nome": "BL_IR", "pinos": ["D0", "D1", "D2", "D3"], "liga": "Registrador de Instrução (IR) J3"}, {"ref": "J19", "nome": "BL_OUT", "pinos": ["D0", "D1", "D2", "D3"], "liga": "Registrador de Saída J3"}, {"ref": "J20", "nome": "BL_PC", "pinos": ["D0", "D1", "D2", "D3"], "liga": "Contador de Programa (PC) J4"}, {"ref": "J21", "nome": "BL_RAM", "pinos": ["D0", "D1", "D2", "D3"], "liga": "RAM e MAR J4"}, {"ref": "J22", "nome": "BH_ACC", "pinos": ["D4", "D5", "D6", "D7"], "liga": "Registrador A (Acumulador) J4"}, {"ref": "J23", "nome": "BH_B", "pinos": ["D4", "D5", "D6", "D7"], "liga": "Registrador B J4"}, {"ref": "J24", "nome": "BH_ALU", "pinos": ["D4", "D5", "D6", "D7"], "liga": "ULA (Unidade Lógica e Aritmética) J3"}, {"ref": "J25", "nome": "BH_IR", "pinos": ["D4", "D5", "D6", "D7"], "liga": "Registrador de Instrução (IR) J4"}, {"ref": "J26", "nome": "BH_OUT", "pinos": ["D4", "D5", "D6", "D7"], "liga": "Registrador de Saída J4"}, {"ref": "J27", "nome": "BH_PC", "pinos": ["D4", "D5", "D6", "D7"], "liga": "Contador de Programa (PC) J5"}, {"ref": "J28", "nome": "BH_RAM", "pinos": ["D4", "D5", "D6", "D7"], "liga": "RAM e MAR J5"}, {"ref": "J29", "nome": "C_ACC", "pinos": ["CLK", "/ACI", "RST", "/ACO"], "liga": "Registrador A (Acumulador) J2"}, {"ref": "J30", "nome": "C_B", "pinos": ["CLK", "/BRI", "RST", "+5V"], "liga": "Registrador B J2"}, {"ref": "J31", "nome": "C_IR", "pinos": ["CLK", "/IRI", "RST", "/IRO"], "liga": "Registrador de Instrução (IR) J2"}, {"ref": "J32", "nome": "C_OUT", "pinos": ["CLK", "/ORI", "RST", "NC"], "liga": "Registrador de Saída J2"}, {"ref": "J33", "nome": "C_PC1", "pinos": ["PCI", "CLK", "/JMP", "/RST"], "liga": "Contador de Programa (PC) J2"}, {"ref": "J34", "nome": "C_PC2", "pinos": ["/PCO", "NC", "NC", "NC"], "liga": "Contador de Programa (PC) J3"}, {"ref": "J35", "nome": "C_RAM1", "pinos": ["CLK", "/MAI", "RST", "RMI"], "liga": "RAM e MAR J2"}, {"ref": "J36", "nome": "C_RAM2", "pinos": ["NC", "NC", "/RMO", "NC"], "liga": "RAM e MAR J3"}, {"ref": "J37", "nome": "C_ALU1", "pinos": ["/ALUO", "SUB", "AL0", "AL1"], "liga": "ULA (Unidade Lógica e Aritmética) J8"}, {"ref": "J38", "nome": "C_ALU2", "pinos": ["NOT", "NC", "NC", "NC"], "liga": "ULA (Unidade Lógica e Aritmética) J9"}, {"ref": "J39", "nome": "CD_A", "pinos": ["/IRI", "/RMO", "RMI", "/MAI"], "liga": "Decodificador de Controle J5"}, {"ref": "J40", "nome": "CD_B", "pinos": ["/PCO", "/JMP", "PCI", "HLT"], "liga": "Decodificador de Controle J6"}, {"ref": "J41", "nome": "CD_C", "pinos": ["NOT", "/ALUO", "AL0", "AL1"], "liga": "Decodificador de Controle J7"}, {"ref": "J42", "nome": "CD_D", "pinos": ["SUB", "/ACI", "/ACO", "/IRO"], "liga": "Decodificador de Controle J8"}, {"ref": "J43", "nome": "CD_E", "pinos": ["/BRI", "/ORI", "E0_5", "E0_4"], "liga": "Decodificador de Controle J9"}, {"ref": "J44", "nome": "C_FETCH", "pinos": ["/Y5", "/CLK", "/STCLR", "NC"], "liga": "Contador de Passos J3"}, {"ref": "J45", "nome": "C_CLOCK", "pinos": ["CLK", "/CLK", "HLT", "NC"], "liga": "Clock J2"}, {"ref": "J46", "nome": "C_RESET", "pinos": ["RST", "/RST", "/Y5", "/STCLR"], "liga": "Reset J2"}, {"ref": "J47", "nome": "EXPANSAO", "pinos": ["E0_5", "E0_4", "CLK", "RST"], "liga": ""}], "w": 204.5, "h": 153.0, "furos": 250, "ncomp": 70, "nci": 0, "pagina": "https://github.com/aragonxpd154/8-bits-computer/blob/main/docs/placas/backplane-barramento.md"}, {"id": "clock-astavel-monoestavel", "ordem": 2, "nome": "Clock", "resumo": "Gera o \"batimento\" do computador: automático (0,7–140 Hz) ou passo a passo, e para no HLT.", "funcao": "Produz o sinal <strong>CLK<\/strong> que sincroniza todo o computador, e o seu inverso <strong>/CLK<\/strong>. Há dois modos: <strong>AUTOMÁTICO<\/strong>, com velocidade ajustável no potenciômetro, e <strong>MANUAL<\/strong>, em que cada toque no botão PASSO gera exatamente um pulso — ideal para ver cada passo da instrução nos LEDs. Quando o programa executa <code>HLT<\/code>, o sinal HLT chega aqui e trava o clock.", "funcionamento": ["<strong>Metade 1 do NE556 — astável.<\/strong> Oscila sozinho, carregando e descarregando C1 (10 µF) através de R1 (1 kΩ) e do potenciômetro RV1 (100 kΩ). A frequência é f ≈ 1,44 / ((R1 + 2·RV1) · C1): de <strong>≈ 0,7 Hz<\/strong> (RV1 no máximo) até <strong>≈ 140 Hz<\/strong> (RV1 no mínimo). R2 (10 Ω) evita curto quando o potenciômetro está em zero.", "<strong>Metade 2 do NE556 — monoestável.<\/strong> O botão PASSO (SW1) dispara um único pulso de t ≈ 1,1 · R5 · C4 = 1,1 · 330 kΩ · 330 nF ≈ 0,12 s. Como o pulso tem duração fixa, o <strong>repique<\/strong> (bounce) do botão é ignorado: um toque = um pulso.", "<strong>Seleção do modo.<\/strong> A chave AUTO/MANUAL (SW2) é invertida duas vezes pelo 74LS04 (sinal MODE limpo). Três portas NAND do 74LS00 formam um multiplexador: quando MODE = 1 passa o astável, quando MODE = 0 passa o monoestável.", "<strong>HLT.<\/strong> A última porta NAND junta o clock escolhido com /HLT: com HLT = 1 a saída fica parada. Uma porta do 74LS04 gera o CLK final e a saída /CLK, que vai para o Contador de Passos.", "C2 e C3 (10 nF) estabilizam o pino de controle (CV) de cada 555; C5…C7 são desacoplamento dos CIs."], "blocos": [["U1 NE556", "dois temporizadores 555: astável (automático) e monoestável (passo manual)"], ["U2 74LS00", "multiplexador AUTO/MANUAL e bloqueio por HLT"], ["U3 74LS04", "inversores: limpa a chave de modo, gera CLK e /CLK, inverte HLT"], ["RV1 + C1", "definem a velocidade do clock automático"], ["R5 + C4", "definem a largura do pulso manual"]], "leds": [["LED1 (azul)", "pisca no ritmo do CLK"]], "controles": [["RV1", "velocidade do clock automático"], ["SW2", "AUTO / MANUAL"], ["SW1 PASSO", "um pulso de clock por toque (modo manual)"]], "conectores": [{"ref": "J1", "nome": "ALIMENTACAO", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "backplane J12 (P_CLOCK)"}, {"ref": "J2", "nome": "CLOCK", "pinos": ["CLK", "/CLK", "HLT", "NC"], "liga": "backplane J45 (C_CLOCK)"}], "w": 105.34, "h": 85.76, "furos": 96, "ncomp": 21, "nci": 3, "pagina": "https://github.com/aragonxpd154/8-bits-computer/blob/main/docs/placas/clock-astavel-monoestavel.md"}, {"id": "reset-circuito", "ordem": 3, "nome": "Reset", "resumo": "Reinicia o computador pelo botão ou ao ligar, e reinicia o contador de passos a cada instrução.", "funcao": "Gera <strong>RST<\/strong> (ativo em 1) e <strong>/RST<\/strong> (ativo em 0) para zerar o Contador de Programa, a MAR e os registradores. Também gera <strong>/STCLR<\/strong>, que zera o Contador de Passos ao fim de cada instrução (quando chega o sinal /Y5) ou durante o reset.", "funcionamento": ["<strong>Botão com pull-up.<\/strong> R1 (10 kΩ) mantém /BTN em 1; apertar RESET (SW1) leva /BTN a 0. A primeira porta do 74LS132 inverte: RST = 1 enquanto o botão estiver apertado.", "<strong>Reset ao ligar.<\/strong> C1 (10 µF) começa descarregado, então ao ligar /BTN fica em 0 por cerca de R1·C1 ≈ 0,1 s — o computador sempre começa zerado, sem precisar apertar nada.", "<strong>Por que 74LS132?<\/strong> É um NAND com entrada <strong>Schmitt-trigger<\/strong>: a subida lenta da tensão de C1 vira uma borda limpa. O 74LS00 tem a mesma pinagem e funciona, mas o 132 é recomendado.", "<strong>/RST.<\/strong> A segunda porta inverte RST. O LED1 vermelho acende enquanto o reset está ativo.", "<strong>/STCLR = /RST AND /Y5.<\/strong> As duas últimas portas fazem um AND: o Contador de Passos é zerado quando chega o passo 5 (fim da instrução, /Y5 = 0) <strong>ou<\/strong> durante o reset. R2 mantém /Y5 em 1 se o cabo estiver solto."], "blocos": [["U1 74LS132", "4 portas NAND Schmitt: inverte o botão, gera /RST e o AND de /STCLR"], ["R1 + C1", "pull-up do botão e atraso do reset ao ligar"], ["R2", "pull-up de /Y5"], ["SW1", "botão RESET"]], "leds": [["LED1 (vermelho)", "reset ativo"]], "controles": [["SW1 RESET", "zera o computador (PC, MAR, registradores e passo)"]], "conectores": [{"ref": "J1", "nome": "ALIMENTACAO", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "backplane J13 (P_RESET)"}, {"ref": "J2", "nome": "RESET", "pinos": ["RST", "/RST", "/Y5", "/STCLR"], "liga": "backplane J46 (C_RESET)"}], "w": 66.71, "h": 57.8, "furos": 42, "ncomp": 10, "nci": 1, "pagina": "https://github.com/aragonxpd154/8-bits-computer/blob/main/docs/placas/reset-circuito.md"}, {"id": "pc-contador-programa", "ordem": 4, "nome": "Contador de Programa (PC)", "resumo": "Guarda o endereço da próxima instrução (0…15), conta +1 a cada busca e salta no JMP.", "funcao": "O <strong>Program Counter<\/strong> diz em qual endereço da RAM está a próxima instrução. No início de cada instrução ele coloca o endereço no barramento (/PCO) e, logo depois, conta +1 (PCI). Na instrução <code>JMP<\/code> ele carrega um novo endereço vindo do barramento (/JMP).", "funcionamento": ["<strong>74LS161<\/strong> é um contador binário síncrono de 4 bits. Com PCI = 1 (entradas ENP e ENT), ele soma 1 na borda de subida do CLK. Com /JMP = 0 (entrada /LOAD), em vez de contar ele copia D0…D3 do barramento.", "<strong>/RST<\/strong> vai na entrada /CLR: o reset zera o contador imediatamente, sem esperar o clock.", "<strong>74LS245<\/strong> é a \"porta\" para o barramento. Com /PCO = 0, as saídas P0…P3 vão para D0…D3 e as entradas aterradas colocam 0 em D4…D7. Com /PCO = 1 ele fica em alta impedância e não interfere no barramento.", "Os 4 LEDs mostram o endereço atual em binário."], "blocos": [["U1 74LS161", "contador de 4 bits com carga paralela (JMP) e clear (reset)"], ["U2 74LS245", "buffer 3-state: coloca o endereço no barramento quando /PCO = 0"]], "leds": [["LED1…LED4", "endereço atual P3…P0 (aceso = 1)"]], "controles": [], "conectores": [{"ref": "J1", "nome": "ALIMENTACAO", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "backplane J8 (P_PC)"}, {"ref": "J2", "nome": "CONTROLE", "pinos": ["PCI", "CLK", "/JMP", "/RST"], "liga": "backplane J33 (C_PC1)"}, {"ref": "J3", "nome": "CONTROLE2", "pinos": ["/PCO", "NC", "NC", "NC"], "liga": "backplane J34 (C_PC2)"}, {"ref": "J4", "nome": "BUS_L", "pinos": ["D0", "D1", "D2", "D3"], "liga": "backplane J20 (BL_PC)"}, {"ref": "J5", "nome": "BUS_H", "pinos": ["D4", "D5", "D6", "D7"], "liga": "backplane J27 (BH_PC)"}], "w": 92.25, "h": 68.61, "furos": 85, "ncomp": 17, "nci": 2, "pagina": "https://github.com/aragonxpd154/8-bits-computer/blob/main/docs/placas/pc-contador-programa.md"}, {"id": "ram-mar-memoria", "ordem": 5, "nome": "RAM e MAR", "resumo": "16 bytes de memória, o registrador de endereço (MAR) e a programação manual por chaves DIP.", "funcao": "Guarda o <strong>programa e os dados<\/strong> (16 posições de 8 bits). A <strong>MAR<\/strong> (Memory Address Register) guarda o endereço que será lido ou escrito. Uma chave <strong>PROG/RUN<\/strong> escolhe quem manda: no modo PROG você escolhe endereço e dado nas chaves DIP e aperta GRAVAR; no modo RUN quem manda é o computador.", "funcionamento": ["<strong>MAR (U6 74LS173).<\/strong> Na borda do CLK, se /MAI = 0, copia D0…D3 do barramento. É zerada pelo RST.", "<strong>Multiplexadores (U7…U10 74LS157).<\/strong> Cada 74LS157 tem 4 chaves eletrônicas de 2 posições. Com RUN = 0 (modo PROG) eles passam as <strong>chaves DIP<\/strong> (endereço SW1, dado SW3, botão GRAVAR); com RUN = 1 passam a <strong>MAR<\/strong>, o <strong>barramento<\/strong> e o pulso de escrita automático.", "<strong>Memória (U1, U2 74S189).<\/strong> Cada chip guarda 16 × 4 bits; dois chips formam 16 × 8. As saídas do 74S189 são <strong>invertidas<\/strong>, por isso U3 e U4 (74LS04) desinvertem o dado.", "<strong>Saída para o barramento (U5 74LS245).<\/strong> Com /RMO = 0 o byte lido vai para D0…D7.", "<strong>Pulso de escrita sincronizado.<\/strong> Na instrução <code>STA<\/code> o microcódigo liga RMI. U11 (74LS00) bufferiza o CLK, e o diferenciador C13 (1 nF) + R18 (1 kΩ) transforma a subida do clock num pulso de ≈ 1 µs. /WE_RUN = NAND(pulso, RMI): a RAM é escrita só nesse instante, com endereço e dado já estáveis.", "<strong>Chave PROG/RUN sem repique (U12 NE555).<\/strong> O 555 trabalha como flip-flop SR: um lado da chave vai no TRIGGER (liga RUN), o outro no RESET (desliga RUN). A saída troca uma única vez, sem oscilar.", "<strong>Chaves DIP.<\/strong> Ligam ao +5 V, com pull-down de 1 kΩ (RN1, RN2): <strong>chave LIGADA = bit 1<\/strong>."], "blocos": [["U6 74LS173", "MAR — endereço de 4 bits"], ["U7 74LS157", "escolhe o endereço: chaves (PROG) ou MAR (RUN)"], ["U8, U9 74LS157", "escolhe o dado a gravar: chaves (PROG) ou barramento (RUN)"], ["U10 74LS157", "escolhe o pulso de escrita: botão GRAVAR ou automático"], ["U1, U2 74S189", "RAM 16 × 4 bits cada (nibble alto e baixo)"], ["U3, U4 74LS04", "desinvertem as saídas da RAM"], ["U5 74LS245", "coloca o byte lido no barramento (/RMO)"], ["U11 74LS00", "buffer do clock e porta de escrita (RMI)"], ["U12 NE555", "flip-flop da chave PROG/RUN (sem repique)"], ["SW1, SW3", "chaves DIP de endereço (4) e dado (8)"], ["SW4", "botão GRAVAR"]], "leds": [["LED1…LED8", "conteúdo da posição atual Q7…Q0"], ["LED9…LED12 (amarelos)", "endereço atual A3…A0"], ["LED13 (vermelho)", "modo PROG"], ["LED14 (verde)", "modo RUN"]], "controles": [["SW2 PROG/RUN", "programação manual × execução"], ["SW1 ENDEREÇO", "endereço em modo PROG"], ["SW3 DADO", "byte a gravar em modo PROG"], ["SW4 GRAVAR", "grava o byte das chaves no endereço das chaves"]], "conectores": [{"ref": "J1", "nome": "ALIMENTACAO", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "backplane J9 (P_RAM)"}, {"ref": "J2", "nome": "CONTROLE1", "pinos": ["CLK", "/MAI", "RST", "RMI"], "liga": "backplane J35 (C_RAM1)"}, {"ref": "J3", "nome": "CONTROLE2", "pinos": ["/WE", "/CLK", "/RMO", "RUN"], "liga": "backplane J36 (C_RAM2)"}, {"ref": "J4", "nome": "BUS_L", "pinos": ["D0", "D1", "D2", "D3"], "liga": "backplane J21 (BL_RAM)"}, {"ref": "J5", "nome": "BUS_H", "pinos": ["D4", "D5", "D6", "D7"], "liga": "backplane J28 (BH_RAM)"}], "w": 145.1, "h": 139.47, "furos": 494, "ncomp": 69, "nci": 12, "pagina": "https://github.com/aragonxpd154/8-bits-computer/blob/main/docs/placas/ram-mar-memoria.md"}, {"id": "ir-registrador-instrucao", "ordem": 6, "nome": "Registrador de Instrução (IR)", "resumo": "Guarda a instrução atual: o opcode vai para o Controle, o operando volta ao barramento.", "funcao": "Cada instrução tem 8 bits: os <strong>4 de cima são o opcode<\/strong> (qual instrução) e os <strong>4 de baixo são o operando<\/strong> (um endereço ou um número de 0 a 15). O IR guarda a instrução lida da RAM durante toda a sua execução.", "funcionamento": ["<strong>Dois 74LS173<\/strong> guardam o byte: U1 o nibble alto, U2 o nibble baixo. Carregam na borda do CLK quando /IRI = 0 (passo T1 de toda instrução) e são zerados por RST.", "<strong>Opcode.<\/strong> O nibble alto sai direto pelo conector OPCODE (J5) para o Decodificador de Controle, com OP3 no pino 1 — cabo reto.", "<strong>Operando.<\/strong> O 74LS245 coloca <strong>só o nibble baixo<\/strong> no barramento quando /IRO = 0 (as outras 4 entradas estão no GND, então D4…D7 = 0). É assim que <code>LDA 14<\/code> manda o endereço 14 para a MAR."], "blocos": [["U1, U2 74LS173", "registrador de 8 bits (opcode + operando)"], ["U3 74LS245", "devolve o operando ao barramento (/IRO)"]], "leds": [["LED1…LED4", "opcode (bits 7…4)"], ["LED5…LED8", "operando (bits 3…0)"]], "controles": [], "conectores": [{"ref": "J1", "nome": "ALIMENTACAO", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "backplane J6 (P_IR)"}, {"ref": "J2", "nome": "CONTROLE", "pinos": ["CLK", "/IRI", "RST", "/IRO"], "liga": "backplane J31 (C_IR)"}, {"ref": "J3", "nome": "BUS_L", "pinos": ["D0", "D1", "D2", "D3"], "liga": "backplane J18 (BL_IR)"}, {"ref": "J4", "nome": "BUS_H", "pinos": ["D4", "D5", "D6", "D7"], "liga": "backplane J25 (BH_IR)"}, {"ref": "J5", "nome": "OPCODE", "pinos": ["OP3", "OP2", "OP1", "OP0"], "liga": "cabo direto → Decodificador de Controle J3"}], "w": 101.55, "h": 68.61, "furos": 120, "ncomp": 27, "nci": 3, "pagina": "https://github.com/aragonxpd154/8-bits-computer/blob/main/docs/placas/ir-registrador-instrucao.md"}, {"id": "cd-decodificador-controle", "ordem": 7, "nome": "Decodificador de Controle", "resumo": "O \"cérebro\": 3 EEPROMs com o microcódigo ligam os 18 sinais certos em cada passo de cada instrução.", "funcao": "Transforma <strong>opcode + passo<\/strong> em <strong>sinais de controle<\/strong>. É uma tabela gravada em 3 EEPROMs 28C16: o endereço da EEPROM é formado pelo opcode (do IR), pelo passo T0…T2 (do Contador de Passos) e pelas flags; o byte guardado naquele endereço diz quais sinais ligar. Cada EEPROM fornece 8 sinais.", "funcionamento": ["<strong>Endereço:<\/strong> A0…A2 = passo (T0…T2), A3…A6 = opcode (OP0…OP3), A7 = flag de carry (CF), A8 = flag zero (ZF), A9 e A10 no GND. As EEPROMs ficam sempre lendo (/CE e /OE no GND, /WE em +5 V).", "<strong>EEPROM2 (U1):<\/strong> /IRI, /RMO, RMI, /MAI, /PCO, /JMP, PCI, HLT. <strong>EEPROM1 (U2):<\/strong> NOT, /ALUO, AL0, AL1, SUB, /ACI, /ACO, /IRO. <strong>EEPROM0 (U3):<\/strong> /BRI, /ORI e duas saídas livres (E0_4, E0_5) para expansão.", "<strong>Busca (igual para todas as instruções):<\/strong> T0 = PCO + MAI (endereço do PC vai para a MAR); T1 = RMO + IRI + PCI (a instrução vai da RAM para o IR e o PC soma 1).", "<strong>Execução:<\/strong> T2…T4 dependem do opcode. Exemplo <code>ADD 15<\/code>: T2 = IRO + MAI (o operando 15 vai para a MAR), T3 = RMO + BRI (RAM[15] vai para o registrador B), T4 = ALUO + ACI (A + B volta para A).", "<strong>Sinais ativos em 0.<\/strong> Vários sinais (/PCO, /MAI, /IRI…) ligam em nível baixo. O gerador do microcódigo já grava esses bits invertidos, então nos passos vazios todas as saídas ficam desligadas.", "<strong>Flags.<\/strong> O conector FLAGS (J4) tem pull-down (R1, R2): sem a futura placa de flags, CF = ZF = 0 e <code>JC<\/code>/<code>JZ<\/code> não saltam."], "blocos": [["U1 AT28C16", "EEPROM2 — sinais de memória, PC e HLT"], ["U2 AT28C16", "EEPROM1 — sinais da ULA, registrador A e IR"], ["U3 AT28C16", "EEPROM0 — registrador B e saída"], ["R1, R2", "pull-down das flags CF e ZF"]], "leds": [], "controles": [], "conectores": [{"ref": "J1", "nome": "ALIMENTACAO", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "backplane J10 (P_CD)"}, {"ref": "J2", "nome": "PASSO", "pinos": ["T0", "T1", "T2", "NC"], "liga": "cabo direto → Contador de Passos J2"}, {"ref": "J3", "nome": "OPCODE", "pinos": ["OP3", "OP2", "OP1", "OP0"], "liga": "cabo direto → Registrador de Instrução (IR) J5"}, {"ref": "J4", "nome": "FLAGS", "pinos": ["CF", "ZF", "NC", "NC"], "liga": ""}, {"ref": "J5", "nome": "CTRL_A", "pinos": ["/IRI", "/RMO", "RMI", "/MAI"], "liga": "backplane J39 (CD_A)"}, {"ref": "J6", "nome": "CTRL_B", "pinos": ["/PCO", "/JMP", "PCI", "HLT"], "liga": "backplane J40 (CD_B)"}, {"ref": "J7", "nome": "CTRL_C", "pinos": ["NOT", "/ALUO", "AL0", "AL1"], "liga": "backplane J41 (CD_C)"}, {"ref": "J8", "nome": "CTRL_D", "pinos": ["SUB", "/ACI", "/ACO", "/IRO"], "liga": "backplane J42 (CD_D)"}, {"ref": "J9", "nome": "CTRL_E", "pinos": ["/BRI", "/ORI", "E0_5", "E0_4"], "liga": "backplane J43 (CD_E)"}], "w": 161.25, "h": 60.95, "furos": 128, "ncomp": 17, "nci": 3, "pagina": "https://github.com/aragonxpd154/8-bits-computer/blob/main/docs/placas/cd-decodificador-controle.md"}, {"id": "fetch-contador-passos", "ordem": 8, "nome": "Contador de Passos", "resumo": "Conta os passos T0…T4 de cada instrução e avisa (/Y5) quando a instrução terminou.", "funcao": "Toda instrução é executada em até 5 passos (T0 a T4), um por pulso de clock. Esta placa conta o passo atual, manda o número (T0…T2 em binário) para o Decodificador de Controle e mostra nos LEDs em qual passo o computador está.", "funcionamento": ["<strong>74LS161<\/strong> conta na borda de <strong>/CLK<\/strong>, ou seja, na <strong>descida<\/strong> do CLK. Assim o passo muda no meio do ciclo e os sinais de controle já estão estáveis quando chega a próxima subida do CLK (quando os registradores carregam).", "<strong>74LS138<\/strong> é um decodificador 3→8: transforma o número binário em uma linha ativa. /S0…/S4 acendem os LEDs de passo; /Y5 vai para a placa de Reset.", "<strong>Fim da instrução:<\/strong> quando o contador chega a 5, /Y5 vai a 0, a placa de Reset gera /STCLR = 0 e o 74LS161 volta imediatamente a 0. O estado 5 dura poucos nanossegundos — na prática a sequência é T0…T4, T0…"], "blocos": [["U1 74LS161", "contador do passo (conta na descida do CLK)"], ["U2 74LS138", "decodifica o passo em linhas /S0…/S4 e /Y5"]], "leds": [["LED1…LED3 (amarelos)", "passo em binário T2 T1 T0"], ["LED4…LED8 (verdes)", "passo atual T0…T4 (um aceso por vez)"]], "controles": [], "conectores": [{"ref": "J1", "nome": "ALIMENTACAO", "pinos": ["+5V", "+5V", "GND", "GND"], "liga": "backplane J11 (P_FETCH)"}, {"ref": "J2", "nome": "PASSO", "pinos": ["T0", "T1", "T2", "NC"], "liga": "cabo direto → Decodificador de Controle J2"}, {"ref": "J3", "nome": "CONTROLE", "pinos": ["/Y5", "/CLK", "/STCLR", "NC"], "liga": "backplane J44 (C_FETCH)"}], "w": 69.7, "h": 68.61, "furos": 86, "ncomp": 23, "nci": 2, "pagina": "https://github.com/aragonxpd154/8-bits-computer/blob/main/docs/placas/fetch-contador-passos.md"}, {"id": "acc-registrador-a", "ordem": 9, "nome": "Registrador A (Acumulador)", "resumo": "Registrador principal de 8 bits: guarda o resultado das contas e alimenta a ULA.", "funcao": "O <strong>acumulador<\/strong> guarda o operando principal e o resultado das operações. Sua saída está sempre ligada à entrada A da ULA (conectores ALU_L e ALU_H) e pode ser colocada no barramento para gravar na RAM (<code>STA<\/code>) ou mostrar no display (<code>OUT<\/code>).", "funcionamento": ["<strong>Dois 74LS173<\/strong> (4 bits cada) formam 8 bits. Carregam o barramento na subida do CLK quando /ACI = 0. RST zera.", "<strong> <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const P = window.PLACAS, $ = (id) => document.getElementById(id);
if (/[?&]render\b/.test(location.search)) document.body.classList.add('render');
const canvas = $('cena'), palco = $('palco');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
const cena = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
cena.environment = pm.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const sol = new THREE.DirectionalLight(0xffffff, 1.4); sol.position.set(0.15, 0.35, 0.2); cena.add(sol);
cena.add(new THREE.HemisphereLight(0xffffff, 0x334433, 0.5));
const cam = new THREE.PerspectiveCamera(35, 1, 0.001, 10);
const ctl = new OrbitControls(cam, canvas);
ctl.enableDamping = true; ctl.dampingFactor = 0.08; ctl.autoRotateSpeed = 1.2;
const loader = new GLTFLoader();
const cache = new Map();
let atual = null, raio = 0.1, vista = '3d', anim = null;
const reduz = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function tamanho() {
  const r = palco.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  cam.aspect = r.width / Math.max(r.height, 1); cam.updateProjectionMatrix();
}
new ResizeObserver(tamanho).observe(palco);

function alvoVista(v) {
  const t = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  const d = Math.max(raio / t * 0.8, raio / (t * cam.aspect)) * (document.body.classList.contains('render') ? 1.45 : 1.18);
  if (v === 'topo') return new THREE.Vector3(0, d, 0.0001);
  if (v === 'fundo') return new THREE.Vector3(0, -d, 0.0001);
  return new THREE.Vector3(0.38, 0.72, 0.58).normalize().multiplyScalar(d * 1.05);
}
function irPara(v, instantaneo) {
  vista = v;
  ['3d', 'topo', 'fundo'].forEach((k) => $('v-' + k).setAttribute('aria-pressed', String(k === v)));
  const fim = alvoVista(v), ini = cam.position.clone();
  if (instantaneo || reduz) { cam.position.copy(fim); ctl.target.set(0, 0, 0); ctl.update(); return; }
  const t0 = performance.now();
  anim = (t) => { const k = Math.min((t - t0) / 650, 1), e = 1 - Math.pow(1 - k, 3);
    cam.position.lerpVectors(ini, fim, e); ctl.target.set(0, 0, 0); if (k >= 1) anim = null; };
}
function aplicaComponentes() {
  if (!atual) return;
  const mostra = $('c-comp').checked;
  atual.traverse((o) => { if (o.isMesh && !o.userData.placa) o.visible = mostra; });

async function carrega(p) {
  $('estado').hidden = false; $('estado').textContent = 'carregando ' + p.nome + '…';
  let g = cache.get(p.id);
  if (!g) {
    try {
      let gltf;
      if (window.MODELOS_B64) {   // versao publicada: o .glb vai como texto base64
        const r = await fetch(window.BASE_MODELOS + p.id + '.glb.txt');
        if (!r.ok) throw new Error(r.status);
        const bin = atob((await r.text()).trim()), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        gltf = await loader.parseAsync(u8.buffer, '');
      } else {
        gltf = await loader.loadAsync(window.BASE_MODELOS + p.id + '.glb');
      }
      g = new THREE.Group();
      const m = gltf.scene;
      m.rotation.x = -Math.PI / 2;          // KiCad: placa no plano XY -> deitada no plano XZ
      m.traverse((o) => { if (o.isMesh) {
        o.userData.placa = /PCB|superficie/i.test(o.name) || /PCB|superficie/i.test(o.parent && o.parent.name || '');
        if (o.material && o.material.map) { o.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); o.material.envMapIntensity = 0.35; }
      } });
      g.add(m);
      const box = new THREE.Box3().setFromObject(g), c = box.getCenter(new THREE.Vector3());
      m.position.sub(c);

    } catch (e) {
      $('estado').textContent = 'Não foi possível abrir o modelo 3D (' + p.id + '.glb). Abra esta página por um servidor (veja docs/3d/README.md).';
      return;
    }
  }

  atual = g; cena.add(g);
  const s = new THREE.Box3().setFromObject(g).getSize(new THREE.Vector3());
  raio = Math.max(s.x, s.z) / 2;
  aplicaComponentes(); irPara(vista, true);
  $('estado').hidden = true;
  window.__pronto = p.id;
}

const br = (v) => String(v).replace('.', ',');
function ficha(p) {
  const lista = (arr) => arr.length ? '<table class="tab"><tbody>' + arr.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('') + '</tbody></table>' : '';
  const con = (c) => `<div class="con"><div class="cab"><span class="ref">${c.ref}</span><span class="nm">${c.nome}</span>${c.liga ? `<span class="liga">${c.liga}</span>` : ''}</div>`
    + `<div class="pinos">${c.pinos.map((s, i) => `<span><b>${i + 1}</b>${s}</span>`).join('')}</div></div>`;
  const cons = p.conectores.length > 12
    ? `${p.conectores.slice(0, 4).map(con).join('')}<details><summary>mais ${p.conectores.length - 4} conectores</summary>${p.conectores.slice(4).map(con).join('')}</details>`
    : p.conectores.map(con).join('');
  $('ficha').innerHTML = `<h2>${p.nome}</h2><p class="resumo">${p.resumo}</p>
    <ul class="chips"><li>${br(p.w)} × ${br(p.h)} mm</li><li>${p.nci} ${p.nci === 1 ? 'CI' : 'CIs'}</li><li>${p.ncomp} componentes</li><li>${p.furos} furos</li><li>2 camadas</li></ul>
    <h3>Função</h3><p>${p.funcao}</p>
    <h3>Como funciona</h3>${p.funcionamento.map((t) => `<p>${t}</p>`).join('')}
    <h3>O que cada parte faz</h3>${lista(p.blocos)}
    ${p.leds.length ? '<h3>LEDs</h3>' + lista(p.leds) : ''}
    ${p.controles.length ? '<h3>Chaves e ajustes</h3>' + lista(p.controles) : ''}
    <h3>Conectores · pino 1 → 4</h3>${cons}
    <a class="mais" href="${p.pagina}" target="_blank" rel="noopener">Página completa da placa no GitHub ↗</a>`;
  $('medida').textContent = `${br(p.w)} × ${br(p.h)} mm`;
}

function seleciona(id, rolar) {
  const p = P.find((x) => x.id === id) || P[0];
  document.querySelectorAll('#lista button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.id === p.id)));
  ficha(p); carrega(p);
  if (location.hash.slice(1) !== p.id) history.replaceState(null, '', '#' + p.id);
  if (rolar) { const b = document.querySelector(`#lista button[data-id="${p.id}"]`); b && b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}

$('lista').innerHTML = P.map((p) => `<button type="button" data-id="${p.id}"><span class="n">${String(p.ordem).padStart(2, '0')}</span><span>${p.nome}</span></button>`).join('');
$('lista').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) seleciona(b.dataset.id); });
['3d', 'topo', 'fundo'].forEach((k) => $('v-' + k).addEventListener('click', () => irPara(k)));
$('c-comp').addEventListener('change', aplicaComponentes);
$('c-gira').addEventListener('change', (e) => { ctl.autoRotate = e.target.checked; });
window.addEventListener('hashchange', () => seleciona(location.hash.slice(1), true));
window.__vista = (v) => irPara(v, true);
window.__componentes = (on) => { $('c-comp').checked = on; aplicaComponentes(); };

tamanho();
seleciona(location.hash.slice(1), true);
renderer.setAnimationLoop((t) => { if (anim) anim(t); ctl.update(); renderer.render(cena, cam); });
</script>
</body>
</html>
